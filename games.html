<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games | INCRWD</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#080a10;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif
}

header{
    min-height:68px;
    padding:14px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    background:#090b12;
    border-bottom:1px solid #252b38
}

.logo{
    font-size:23px;
    font-weight:900;
    letter-spacing:2px
}

nav{
    display:flex;
    flex-wrap:wrap;
    gap:18px
}

nav a{
    color:#c2c9d4;
    text-decoration:none
}

nav a:hover{
    color:#fff
}

main{
    width:min(1400px,94%);
    margin:auto;
    padding:35px 0 70px
}

h1{
    margin:0;
    font-size:clamp(38px,6vw,70px)
}

.subtitle{
    color:#aeb7c5;
    line-height:1.6
}

.toolbar{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    gap:10px;
    margin:25px 0
}

input,select{
    width:100%;
    padding:13px;
    border-radius:9px;
    border:1px solid #303847;
    background:#111620;
    color:#fff;
    font:inherit
}

.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:25px
}

.tab{
    padding:10px 14px;
    border-radius:999px;
    border:1px solid #303847;
    background:#111620;
    color:#c2c9d4;
    cursor:pointer
}

.tab.active{
    background:#00acd6;
    border-color:#00acd6;
    color:#fff
}

.game-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:20px
}

.game-card{
    background:#111620;
    border:1px solid #283142;
    border-radius:14px;
    overflow:hidden;
    transition:.2s;
    position:relative
}

.game-card:hover{
    transform:translateY(-4px);
    border-color:#00acd6
}

.card-image{
    width:100%;
    height:150px;
    object-fit:cover;
    display:block;
    background:#192333
}

.card-placeholder{
    height:150px;
    display:grid;
    place-items:center;
    background:#192333;
    color:#687386;
    font-size:50px
}

.card-top{
    padding:12px 16px 0;
    display:flex;
    justify-content:flex-end
}

.star{
    border:0;
    background:none;
    color:#687386;
    font-size:22px;
    cursor:pointer
}

.star.favorite{
    color:#ffd45c
}

.game-card-content{
    padding:14px 18px 18px
}

.game-card h2{
    margin:0 0 10px;
    font-size:21px
}

.game-card p{
    color:#98a3b3;
    line-height:1.5;
    min-height:48px
}

.meta{
    margin:12px 0;
    font-size:13px;
    color:#748092
}

.play{
    display:inline-block;
    margin-top:8px;
    padding:10px 15px;
    border-radius:9px;
    background:#00acd6;
    color:#fff;
    text-decoration:none;
    font-weight:bold
}

.play:hover{
    background:#00c2ed
}

.empty{
    padding:50px;
    text-align:center;
    color:#7f8a9a
}

.count{
    color:#7f8a9a;
    margin-bottom:15px
}

footer{
    padding:40px 20px;
    text-align:center;
    color:#717b8a;
    border-top:1px solid #252b38
}

@media(max-width:800px){
    header{
        flex-direction:column
    }

    nav{
        justify-content:center
    }

    .toolbar{
        grid-template-columns:1fr
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">INCRWD</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="gameboys.html">Gameboys</a>
        <a href="emulator.html">Emulator</a>
        <a href="add-game.html">Add Game</a>
        <a href="web.html">Web Viewer</a>
    </nav>

</header>

<main>

<h1>🎮 Games</h1>

<p class="subtitle">
    Browse games by category, platform, or favorite.
</p>

<div class="toolbar">

    <input
        id="search"
        placeholder="Search games..."
    >

    <select id="category">
        <option value="all">All Categories</option>
    </select>

    <select id="platform">
        <option value="all">All Platforms</option>
    </select>

    <select id="sort">
        <option value="title">Name</option>
        <option value="category">Category</option>
        <option value="platform">Platform</option>
        <option value="favorites">Favorites</option>
    </select>

</div>

<div class="tabs">

    <button class="tab active" data-mode="all">
        All
    </button>

    <button class="tab" data-mode="featured">
        ⭐ Featured
    </button>

    <button class="tab" data-mode="favorites">
        ❤️ Favorites
    </button>

</div>

<div id="count" class="count"></div>

<div id="gameList" class="game-grid"></div>

<div
    id="empty"
    class="empty"
    style="display:none"
>
    No games matched your filters.
</div>

</main>

<footer>
    Incredible Website Revival
</footer>

<script>

let games = [];
let mode = "all";

const search =
    document.getElementById("search");

const category =
    document.getElementById("category");

const platform =
    document.getElementById("platform");

const sort =
    document.getElementById("sort");

const gameList =
    document.getElementById("gameList");

const empty =
    document.getElementById("empty");

const count =
    document.getElementById("count");

const favorites =
    JSON.parse(
        localStorage.getItem("incrwd-favorites") || "[]"
    );


function saveFavorites(){

    localStorage.setItem(
        "incrwd-favorites",
        JSON.stringify(favorites)
    );

}


function isFavorite(game){

    return favorites.includes(game.title);

}


function toggleFavorite(title){

    const index =
        favorites.indexOf(title);

    if(index >= 0){
        favorites.splice(index,1);
    }else{
        favorites.push(title);
    }

    saveFavorites();
    render();

}


function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function buildFilters(){

    const categories = [
        ...new Set(
            games
                .map(g => g.category)
                .filter(Boolean)
        )
    ].sort();

    const platforms = [
        ...new Set(
            games
                .map(g => g.platform)
                .filter(Boolean)
        )
    ].sort();

    category.innerHTML =
        '<option value="all">All Categories</option>';

    platform.innerHTML =
        '<option value="all">All Platforms</option>';

    for(const item of categories){

        category.innerHTML +=
            `<option value="${escapeHTML(item)}">${escapeHTML(item)}</option>`;

    }

    for(const item of platforms){

        platform.innerHTML +=
            `<option value="${escapeHTML(item)}">${escapeHTML(item)}</option>`;

    }

}


function getPlayURL(game){

    if(
        game.type === "emulator" &&
        game.file
    ){

        return (
            "emulator.html?rom=" +
            encodeURIComponent(game.file) +
            "&core=" +
            encodeURIComponent(game.core || "")
        );

    }

    return game.url || "#";

}


function render(){

    const query =
        search.value
            .trim()
            .toLowerCase();

    let filtered =
        games.filter(game => {

            const text = [
                game.title || "",
                game.description || "",
                game.category || "",
                game.platform || "",
                ...(game.tags || [])
            ]
            .join(" ")
            .toLowerCase();

            const matchesSearch =
                !query ||
                text.includes(query);

            const matchesCategory =
                category.value === "all" ||
                game.category === category.value;

            const matchesPlatform =
                platform.value === "all" ||
                game.platform === platform.value;

            const matchesMode =
                mode === "all" ||
                (
                    mode === "featured" &&
                    game.featured
                ) ||
                (
                    mode === "favorites" &&
                    isFavorite(game)
                );

            return (
                matchesSearch &&
                matchesCategory &&
                matchesPlatform &&
                matchesMode
            );

        });


    filtered.sort((a,b) => {

        if(sort.value === "category"){

            return (
                (a.category || "")
                .localeCompare(
                    b.category || ""
                )
            );

        }

        if(sort.value === "platform"){

            return (
                (a.platform || "")
                .localeCompare(
                    b.platform || ""
                )
            );

        }

        if(sort.value === "favorites"){

            return (
                Number(isFavorite(b)) -
                Number(isFavorite(a)) ||
                (a.title || "")
                .localeCompare(
                    b.title || ""
                )
            );

        }

        return (
            (a.title || "")
            .localeCompare(
                b.title || ""
            )
        );

    });


    count.textContent =
        `${filtered.length} game${
            filtered.length === 1
            ? ""
            : "s"
        }`;

    gameList.innerHTML = "";

    empty.style.display =
        filtered.length
        ? "none"
        : "block";


    for(const game of filtered){

        const card =
            document.createElement("article");

        card.className =
            "game-card";


        const favorite =
            isFavorite(game);

        const playURL =
            getPlayURL(game);

        const external =
            game.type === "web" &&
            /^https?:\/\//i.test(playURL);


        const image =
            game.image
            ? `
                <img
                    class="card-image"
                    src="${escapeHTML(game.image)}"
                    alt="${escapeHTML(game.title || "Game")}"
                    onerror="this.outerHTML='<div class=&quot;card-placeholder&quot;>🎮</div>'"
                >
            `
            : `
                <div class="card-placeholder">
                    🎮
                </div>
            `;


        card.innerHTML = `

            ${image}

            <div class="card-top">

                <button
                    class="star ${favorite ? "favorite" : ""}"
                    title="Favorite"
                >
                    ${favorite ? "★" : "☆"}
                </button>

            </div>

            <div class="game-card-content">

                <h2>
                    ${escapeHTML(
                        game.title || "Untitled"
                    )}
                </h2>

                <p>
                    ${escapeHTML(
                        game.description ||
                        "No description available."
                    )}
                </p>

                <div class="meta">

                    ${escapeHTML(
                        game.category || "Other"
                    )}

                    •

                    ${escapeHTML(
                        game.platform || "Web"
                    )}

                </div>

                <a
                    class="play"
                    href="${escapeHTML(playURL)}"
                    ${
                        external
                        ? 'target="_blank" rel="noopener noreferrer"'
                        : ""
                    }
                >
                    ${
                        game.type === "emulator"
                        ? "▶ Play in Emulator"
                        : "▶ Play"
                    }
                </a>

            </div>
        `;


        card
            .querySelector(".star")
            .addEventListener(
                "click",
                () => toggleFavorite(game.title)
            );


        gameList.appendChild(card);

    }

}


async function loadGames(){

    try{

        const response =
            await fetch(
                "games.json",
                {cache:"no-store"}
            );

        if(!response.ok){

            throw new Error(
                "games.json failed"
            );

        }

        games =
            await response.json();

        buildFilters();
        render();

    }catch(error){

        console.error(error);

        gameList.innerHTML = `

            <div class="game-card">

                <div class="game-card-content">

                    <h2>
                        Game library error
                    </h2>

                    <p>
                        Could not load games.json.
                    </p>

                </div>

            </div>

        `;

    }

}


search.addEventListener(
    "input",
    render
);

category.addEventListener(
    "change",
    render
);

platform.addEventListener(
    "change",
    render
);

sort.addEventListener(
    "change",
    render
);


document
    .querySelectorAll(".tab")
    .forEach(tab => {

        tab.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".tab")
                    .forEach(
                        x =>
                            x.classList.remove(
                                "active"
                            )
                    );

                tab.classList.add(
                    "active"
                );

                mode =
                    tab.dataset.mode;

                render();

            }
        );

    });


loadGames();

</script>

</body>
</html>
