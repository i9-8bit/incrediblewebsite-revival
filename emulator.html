<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Boy Emulator | INCRWD</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: #080a10;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 25px;
            background: #090b12;
            border-bottom: 1px solid #252b38;
        }

        .logo {
            font-size: 23px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }

        nav a {
            color: #c2c9d4;
            text-decoration: none;
        }

        nav a:hover {
            color: white;
        }

        main {
            width: min(1300px, 94%);
            margin: auto;
            padding: 35px 0 60px;
        }

        h1 {
            font-size: clamp(35px, 6vw, 65px);
            margin: 0;
        }

        .subtitle {
            color: #aeb7c5;
            line-height: 1.6;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 25px 0;
        }

        select,
        input,
        button {
            padding: 12px 15px;
            border-radius: 9px;
            border: 1px solid #303847;
            background: #111620;
            color: white;
            font-size: 15px;
        }

        button {
            cursor: pointer;
        }

        button:hover {
            background: #1b2432;
        }

        .emulator-shell {
            width: 100%;
            min-height: 550px;
            padding: 20px;
            border-radius: 16px;
            background: #05070b;
            border: 1px solid #283142;
        }

        #game {
            width: 100%;
            height: 500px;
            min-height: 400px;
        }

        .status {
            margin-top: 18px;
            padding: 14px;
            border-radius: 9px;
            background: #111620;
            color: #aab4c2;
        }

        footer {
            padding: 40px 20px;
            text-align: center;
            color: #717b8a;
            border-top: 1px solid #252b38;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
            }

            #game {
                height: 400px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">INCRWD</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="gameboys.html">Gameboys</a>
        <a href="add-game.html">Add Game</a>
    </nav>
</header>

<main>

    <h1>🕹️ Game Boy Emulator</h1>

    <p class="subtitle">
        Load a GB, GBC, or GBA game that you have the right to use.
    </p>

    <div class="controls">

        <select id="system">
            <option value="gb">Game Boy</option>
            <option value="gbc">Game Boy Color</option>
            <option value="gba" selected>Game Boy Advance</option>
        </select>

        <input
            id="rom"
            type="file"
            accept=".gb,.gbc,.gba"
        >

        <button id="loadButton">
            Load Game
        </button>

    </div>

    <div class="emulator-shell">
        <div id="game"></div>
    </div>

    <div
        id="status"
        class="status">
        Choose a ROM and press Load Game.
    </div>

</main>

<footer>
    EmulatorJS retains its applicable license.
</footer>


<script>
const CDN =
    "https://cdn.emulatorjs.org/stable/data/";

const system =
    document.getElementById("system");

const romInput =
    document.getElementById("rom");

const loadButton =
    document.getElementById("loadButton");

const status =
    document.getElementById("status");


function setStatus(message) {
    status.textContent = message;
}


function getCore(systemName) {

    switch (systemName) {

        case "gb":
            return "gb";

        case "gbc":
            return "gbc";

        case "gba":
            return "gba";

        default:
            return "gba";
    }
}


function clearOldEmulator() {

    document.getElementById("game").innerHTML = "";

    delete window.EJS_player;
    delete window.EJS_core;
    delete window.EJS_gameUrl;
    delete window.EJS_pathtodata;
    delete window.EJS_biosUrl;

    const oldLoader =
        document.getElementById(
            "emulatorjs-loader"
        );

    if (oldLoader) {
        oldLoader.remove();
    }
}


function startEmulator(file) {

    if (!file) {

        setStatus(
            "Please choose a .gb, .gbc, or .gba file."
        );

        return;
    }


    clearOldEmulator();


    const romURL =
        URL.createObjectURL(file);

    const core =
        getCore(system.value);


    /*
     * EmulatorJS documented configuration.
     */

    window.EJS_player =
        "#game";

    window.EJS_core =
        core;

    window.EJS_gameUrl =
        romURL;

    window.EJS_pathtodata =
        CDN;

    window.EJS_biosUrl =
        "";


    setStatus(
        "Starting " +
        file.name +
        " using the " +
        core +
        " core..."
    );


    const loader =
        document.createElement("script");

    loader.id =
        "emulatorjs-loader";

    loader.src =
        CDN + "loader.js";


    loader.onload =
        function() {

            setStatus(
                "Emulator started. " +
                "If the screen stays black, open the browser console " +
                "for the emulator error."
            );

        };


    loader.onerror =
        function() {

            setStatus(
                "EmulatorJS loader failed to download."
            );

        };


    document.body.appendChild(loader);
}


loadButton.addEventListener(
    "click",
    function() {

        startEmulator(
            romInput.files[0]
        );

    }
);
</script>

</body>
</html>
