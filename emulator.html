<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Emulator | INCRWD</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #080a10;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            min-height: 68px;
            padding: 14px 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            background: #090b12;
            border-bottom: 1px solid #252b38;
        }

        .logo {
            font-size: 23px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }

        nav a {
            color: #c2c9d4;
            text-decoration: none;
        }

        nav a:hover {
            color: white;
        }

        main {
            width: min(1350px, 94%);
            margin: auto;
            padding: 35px 0 60px;
        }

        h1 {
            margin: 0;
            font-size: clamp(35px, 6vw, 65px);
        }

        .subtitle {
            color: #aeb7c5;
            line-height: 1.6;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 25px 0;
        }

        input,
        select,
        button {
            padding: 12px 15px;
            border-radius: 9px;
            border: 1px solid #303847;
            background: #111620;
            color: white;
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:hover {
            background: #1c2534;
        }

        .primary {
            background: #00acd6;
            border-color: #00acd6;
        }

        .primary:hover {
            background: #00c2ed;
        }

        .screen {
            min-height: 550px;
            padding: 15px;

            background: #030508;

            border: 1px solid #283142;
            border-radius: 16px;
        }

        #game {
            width: 100%;
            min-height: 510px;
        }

        .status {
            margin-top: 15px;
            padding: 14px;

            border-radius: 9px;

            background: #111620;
            color: #aab4c2;
        }

        .notice {
            margin-top: 15px;
            padding: 14px;

            background: #111620;
            border-radius: 9px;

            color: #929dac;
        }

        footer {
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid #252b38;
            color: #717b8a;
        }

        @media (max-width: 700px) {

            header {
                flex-direction: column;
            }

            nav {
                justify-content: center;
            }

        }

    </style>

</head>

<body>

<header>

    <div class="logo">
        INCRWD
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="games.html">
            Games
        </a>

        <a href="gameboys.html">
            Gameboys
        </a>

    </nav>

</header>


<main>

    <h1>🕹️ Emulator</h1>

    <p
        id="subtitle"
        class="subtitle">
        Load a Game Boy ROM.
    </p>


    <div class="controls">

        <select id="system">

            <option value="gb">
                Game Boy
            </option>

            <option value="gbc">
                Game Boy Color
            </option>

            <option value="gba">
                Game Boy Advance
            </option>

        </select>


        <input
            id="rom"
            type="file"
            accept=".gb,.gbc,.gba"
        />


        <button
            id="loadFile"
            class="primary">

            Load Local ROM

        </button>

    </div>


    <div class="screen">

        <div id="game"></div>

    </div>


    <div
        id="status"
        class="status">

        Ready.

    </div>


    <div class="notice">

        ROM files are loaded in your browser.
        Only use games you have permission to use.

    </div>

</main>


<footer>

    EmulatorJS retains its applicable license.

</footer>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );


const systemSelect =
    document.getElementById(
        "system"
    );


const romInput =
    document.getElementById(
        "rom"
    );


const loadFileButton =
    document.getElementById(
        "loadFile"
    );


const status =
    document.getElementById(
        "status"
    );


const subtitle =
    document.getElementById(
        "subtitle"
    );


const game =
    document.getElementById(
        "game"
    );


const DATA_PATH =
    "https://cdn.emulatorjs.org/stable/data/";


function setStatus(
    message
) {

    status.textContent =
        message;

}


function coreFromSystem(
    system
) {

    if (system === "gb") {
        return "gb";
    }

    if (system === "gbc") {
        return "gbc";
    }

    return "gba";

}


function clearEmulator() {

    game.innerHTML = "";

    const oldLoader =
        document.getElementById(
            "emulatorjs-loader"
        );

    if (oldLoader) {
        oldLoader.remove();
    }

    delete window.EJS_player;
    delete window.EJS_core;
    delete window.EJS_gameUrl;
    delete window.EJS_pathtodata;

}


function startEmulator(
    romURL,
    core,
    title
) {

    clearEmulator();


    window.EJS_player =
        "#game";

    window.EJS_core =
        core;

    window.EJS_gameUrl =
        romURL;

    window.EJS_pathtodata =
        DATA_PATH;


    subtitle.textContent =
        title
            ? "Playing " + title
            : "Game Boy emulator";


    setStatus(
        "Starting emulator..."
    );


    const loader =
        document.createElement(
            "script"
        );


    loader.id =
        "emulatorjs-loader";


    loader.src =
        DATA_PATH +
        "loader.js";


    loader.onload =
        () => {

            setStatus(
                "Emulator started."
            );

        };


    loader.onerror =
        () => {

            setStatus(
                "EmulatorJS failed to load."
            );

        };


    document.body.appendChild(
        loader
    );

}


function loadLocalFile() {

    const file =
        romInput.files[0];


    if (!file) {

        setStatus(
            "Choose a ROM first."
        );

        return;

    }


    const core =
        coreFromSystem(
            systemSelect.value
        );


    const objectURL =
        URL.createObjectURL(
            file
        );


    startEmulator(
        objectURL,
        core,
        file.name
    );

}


function loadRepositoryROM() {

    const rom =
        params.get("rom");

    const coreParam =
        params.get("core");


    if (!rom) {
        return false;
    }


    const core =
        coreParam ||
        "gba";


    const title =
        rom
            .split("/")
            .pop();


    systemSelect.value =
        core === "gb"
            ? "gb"
            : core === "gbc"
                ? "gbc"
                : "gba";


    setStatus(
        "Loading " +
        title +
        "..."
    );


    startEmulator(
        rom,
        core,
        title
    );


    return true;

}


loadFileButton.addEventListener(
    "click",
    loadLocalFile
);


const loadedFromLibrary =
    loadRepositoryROM();


if (!loadedFromLibrary) {

    setStatus(
        "Choose a local ROM to play."
    );

}

</script>

</body>
</html>
