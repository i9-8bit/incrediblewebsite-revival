<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INCRWD Emulator</title>

<style>
body{
  margin:0;
  background:#090b12;
  color:#fff;
  font-family:Arial,sans-serif
}
header{
  padding:16px 22px;
  border-bottom:1px solid #252b38;
  display:flex;
  justify-content:space-between;
  align-items:center
}
nav{
  display:flex;
  gap:15px;
  flex-wrap:wrap
}
nav a{
  color:#8ee5fa;
  text-decoration:none
}
main{
  max-width:1100px;
  margin:auto;
  padding:25px
}
h1{
  margin-top:0
}
.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:20px 0
}
button,input{
  padding:10px;
  border-radius:8px;
  border:1px solid #303847;
  background:#151b26;
  color:#fff
}
button{
  cursor:pointer
}
#game{
  min-height:590px;
  background:#000
}
#status{
  margin:15px 0;
  color:#8994a4
}
#badge{
  color:#8ee5fa;
  font-weight:bold;
  margin-bottom:12px
}
</style>
</head>

<body>

<header>
  <b>INCRWD</b>
  <nav>
    <a href="index.html">Home</a>
    <a href="games.html">Games</a>
    <a href="gameboys.html">Gameboys</a>
    <a href="add-game.html">Add Game</a>
    <a href="web.html">Web Viewer</a>
  </nav>
</header>

<main>
  <h1>🕹️ Universal Emulator</h1>

  <div class="toolbar">
    <input id="rom" type="file">
    <button id="load">Load ROM</button>
    <button id="stop">Stop</button>
  </div>

  <div id="badge"></div>
  <div id="game"></div>
  <div id="status">Choose a ROM to begin.</div>
</main>

<script>
const DATA="https://cdn.emulatorjs.org/stable/data/";

const CORE={
  gb:"gb", gbc:"gb", gba:"gba",
  nes:"nes", fds:"nes",
  sfc:"snes", smc:"snes",
  n64:"n64", z64:"n64", v64:"n64",
  nds:"nds",
  md:"segaMD", gen:"segaMD", smd:"segaMD",
  sms:"segaMS", sg:"segaMS",
  gg:"segaGG",
  "32x":"sega32x",
  pce:"pce",
  ngp:"ngp", ngc:"ngp",
  ws:"ws", wsc:"ws",
  a26:"atari2600",
  a52:"a5200",
  a78:"atari7800",
  lnx:"lynx",
  col:"coleco",
  d64:"vice_x64sc",
  iso:"psx", cue:"psx", chd:"psx", pbp:"psx"
};

const NAME={
  gb:"Nintendo Game Boy",
  gbc:"Nintendo Game Boy Color",
  gba:"Nintendo Game Boy Advance",
  nes:"Nintendo Entertainment System",
  snes:"Super Nintendo",
  n64:"Nintendo 64",
  nds:"Nintendo DS",
  segaMD:"Sega Genesis / Mega Drive",
  segaMS:"Sega Master System",
  segaGG:"Sega Game Gear",
  sega32x:"Sega 32X",
  pce:"PC Engine",
  ngp:"Neo Geo Pocket",
  ws:"WonderSwan",
  atari2600:"Atari 2600",
  a5200:"Atari 5200",
  atari7800:"Atari 7800",
  lynx:"Atari Lynx",
  coleco:"ColecoVision",
  vice_x64sc:"Commodore 64",
  psx:"Sony PlayStation"
};

const file=document.getElementById("rom");
const load=document.getElementById("load");
const stop=document.getElementById("stop");
const game=document.getElementById("game");
const status=document.getElementById("status");
const badge=document.getElementById("badge");

let started=false;

function ext(name){
  const p=name.toLowerCase().split(".");
  return p.length>1?p.pop():"";
}

function start(source,core,name){
  if(started)return;

  started=true;

  window.EJS_player="#game";
  window.EJS_gameName=name;
  window.EJS_gameUrl=source;
  window.EJS_core=core;
  window.EJS_pathtodata=DATA;
  window.EJS_biosUrl="";
  window.EJS_startOnLoaded=true;
  window.EJS_disableDatabases=true;

  badge.textContent=NAME[core]||core;
  status.textContent="Loading "+name+"...";

  const s=document.createElement("script");
  s.src=DATA+"loader.js";

  s.onload=()=>{
    status.textContent=(NAME[core]||core)+" emulator started.";
  };

  s.onerror=()=>{
    started=false;
    status.textContent="EmulatorJS failed to load.";
  };

  document.body.appendChild(s);
}

function loadFile(f){
  if(!f){
    status.textContent="Choose a ROM first.";
    return;
  }

  const core=CORE[ext(f.name)];

  if(!core){
    status.textContent="Unsupported ROM: "+ext(f.name);
    return;
  }

  start(f,core,f.name);
}

load.onclick=()=>{
  loadFile(file.files[0]);
};

stop.onclick=()=>{
  location.href="emulator.html";
};

const q=new URLSearchParams(location.search);
const rom=q.get("rom");
const core=q.get("core");

if(rom){
  const name=decodeURIComponent(rom.split("/").pop());
  const detected=core||CORE[ext(name)];

  if(detected){
    start(new URL(rom,location.href).href,detected,name);
  }else{
    status.textContent="Could not detect emulator core.";
  }
}
</script>

</body>
</html>
