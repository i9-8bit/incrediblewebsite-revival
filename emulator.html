<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emulator | INCRWD</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: #080a10;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            min-height: 68px;
            padding: 14px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: #090b12;
            border-bottom: 1px solid #252b38;
        }

        .logo {
            font-size: 23px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }

        nav a {
            color: #c2c9d4;
            text-decoration: none;
        }

        nav a:hover {
            color: white;
        }

        main {
            width: min(1350px, 94%);
            margin: auto;
            padding: 35px 0 60px;
        }

        h1 {
            margin: 0;
            font-size: clamp(35px, 6vw, 65px);
        }

        .subtitle {
            color: #aeb7c5;
            line-height: 1.6;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 25px 0;
        }

        input,
        select,
        button {
            padding: 12px 15px;
            border-radius: 9px;
            border: 1px solid #303847;
            background: #111620;
            color: white;
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:hover {
            background: #1d2635;
        }

        .primary {
            background: #00acd6;
            border-color: #00acd6;
        }

        .emulator-shell {
            min-height: 600px;
            padding: 15px;
            background: #020305;
            border: 1px solid #283142;
            border-radius: 16px;
        }

        #game {
            width: 100%;
            min-height: 560px;
        }

        .status {
            margin-top: 15px;
            padding: 14px;
            background: #111620;
            border-radius: 9px;
            color: #aab4c2;
        }

        footer {
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid #252b38;
            color: #717b8a;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
            }

            nav {
                justify-content: center;
            }
        }
    </style>

    <!-- EmulatorJS configuration: declared ONCE -->
    <script>
        const emulatorParams =
            new URLSearchParams(window.location.search);

        const emulatorRom =
            emulatorParams.get("rom");

        const emulatorCore =
            emulatorParams.get("core") || "gba";

        window.EJS_player = "#game";
        window.EJS_core = emulatorCore;
        window.EJS_pathtodata =
            "https://cdn.emulatorjs.org/stable/data/";

        window.EJS_startOnLoaded = true;

        if (emulatorRom) {
            window.EJS_gameUrl =
                new URL(
                    emulatorRom,
                    window.location.href
                ).href;

            window.EJS_gameName =
                decodeURIComponent(
                    emulatorRom.split("/").pop()
                );
        }

    </script>

    <!-- LOAD EMULATORJS ONLY ONCE -->
    <script
        src="https://cdn.emulatorjs.org/stable/data/loader.js">
    </script>

</head>

<body>

<header>

    <div class="logo">
        INCRWD
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="gameboys.html">Gameboys</a>
        <a href="add-game.html">Add Game</a>
    </nav>

</header>

<main>

    <h1>🕹️ Emulator</h1>

    <p id="subtitle" class="subtitle">
        Loading emulator...
    </p>

    <div class="controls">

        <select id="system">

            <option value="gb">
                Game Boy
            </option>

            <option value="gbc">
                Game Boy Color
            </option>

            <option value="gba" selected>
                Game Boy Advance
            </option>

        </select>

        <input
            id="localRom"
            type="file"
            accept=".gb,.gbc,.gba"
        >

        <button
            id="localButton"
            class="primary">
            Load Local ROM
        </button>

    </div>

    <div class="emulator-shell">
        <div id="game"></div>
    </div>

    <div id="status" class="status">
        Initializing...
    </div>

</main>

<footer>
    EmulatorJS retains its applicable license.
</footer>


<script>
    const emulatorSubtitle =
        document.getElementById("subtitle");

    const emulatorStatus =
        document.getElementById("status");

    const emulatorSystem =
        document.getElementById("system");

    const emulatorLocalRom =
        document.getElementById("localRom");

    const emulatorLocalButton =
        document.getElementById("localButton");


    function updateEmulatorStatus(message) {
        emulatorStatus.textContent = message;
    }


    if (emulatorRom) {

        emulatorSystem.value =
            emulatorCore;

        emulatorSubtitle.textContent =
            "Loading " +
            decodeURIComponent(
                emulatorRom.split("/").pop()
            );

        updateEmulatorStatus(
            "Starting " +
            emulatorCore +
            " emulator..."
        );

    } else {

        emulatorSubtitle.textContent =
            "Choose a ROM to play.";

        updateEmulatorStatus(
            "EmulatorJS loaded. Choose a ROM."
        );

    }


    /*
     * Local ROM support.
     *
     * We keep this page initialization to ONE
     * EmulatorJS loader. A local file is loaded
     * by opening a fresh emulator page with its
     * selected file URL.
     */

    emulatorLocalButton.addEventListener(
        "click",
        function () {

            const selectedFile =
                emulatorLocalRom.files[0];

            if (!selectedFile) {

                updateEmulatorStatus(
                    "Choose a ROM first."
                );

                return;
            }


            let selectedCore =
                emulatorSystem.value;


            const extension =
                selectedFile.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            if (
                selectedCore === "gb" &&
                extension !== "gb"
            ) {

                updateEmulatorStatus(
                    "Game Boy requires a .gb file."
                );

                return;
            }


            if (
                selectedCore === "gbc" &&
                extension !== "gbc"
            ) {

                updateEmulatorStatus(
                    "Game Boy Color requires a .gbc file."
                );

                return;
            }


            if (
                selectedCore === "gba" &&
                extension !== "gba"
            ) {

                updateEmulatorStatus(
                    "Game Boy Advance requires a .gba file."
                );

                return;
            }


            /*
             * For now, repository-hosted ROMs are the
             * reliable path. Local ROM loading will be
             * upgraded separately so it doesn't fight
             * EmulatorJS initialization.
             */

            updateEmulatorStatus(
                "Local ROM selected: " +
                selectedFile.name +
                "."
            );

        }
    );


    window.addEventListener(
        "load",
        function () {

            if (emulatorRom) {

                updateEmulatorStatus(
                    "EmulatorJS loaded. Starting game..."
                );

            }

        }
    );
</script>

</body>
</html>
