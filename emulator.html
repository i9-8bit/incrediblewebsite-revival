<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Emulator | INCRWD</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #080a10;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            min-height: 68px;
            padding: 14px 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #090b12;
            border-bottom: 1px solid #252b38;
        }

        .logo {
            font-size: 23px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }

        nav a {
            color: #c2c9d4;
            text-decoration: none;
        }

        nav a:hover {
            color: white;
        }

        main {
            width: min(1350px, 94%);
            margin: auto;
            padding: 30px 0 60px;
        }

        h1 {
            margin: 0;
            font-size: clamp(35px, 6vw, 65px);
        }

        .subtitle {
            color: #aeb7c5;
            line-height: 1.6;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        input,
        select,
        button {
            padding: 12px 15px;
            border-radius: 9px;
            border: 1px solid #303847;
            background: #111620;
            color: white;
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:hover {
            background: #1d2635;
        }

        .primary {
            background: #00acd6;
            border-color: #00acd6;
        }

        .primary:hover {
            background: #00c1ed;
        }

        .emulator-shell {
            width: 100%;
            min-height: 600px;
            padding: 15px;

            background: #020305;

            border: 1px solid #283142;
            border-radius: 16px;
        }

        #game {
            width: 100%;
            min-height: 560px;
        }

        .status {
            margin-top: 15px;
            padding: 14px;

            background: #111620;
            border-radius: 9px;

            color: #aab4c2;
        }

        footer {
            padding: 40px 20px;
            text-align: center;

            border-top: 1px solid #252b38;

            color: #717b8a;
        }

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav {
                justify-content: center;
            }

        }

    </style>


    <script>
        /*
         * EmulatorJS configuration.
         */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const romParameter =
            params.get("rom");


        const coreParameter =
            params.get("core");


        /*
         * Convert the repository-relative
         * ROM path to an absolute URL.
         */

        let romURL = "";

        if (romParameter) {

            romURL =
                new URL(
                    romParameter,
                    window.location.href
                ).href;

        }


        window.EJS_player =
            "#game";


        window.EJS_gameUrl =
            romURL;


        window.EJS_gameName =
            romParameter
                ? romParameter
                    .split("/")
                    .pop()
                : "INCRWD Game";


        window.EJS_core =
            coreParameter || "gba";


        window.EJS_pathtodata =
            "https://cdn.emulatorjs.org/stable/data/";


        window.EJS_startOnLoaded =
            true;


        window.EJS_DEBUG_XX =
            true;


        /*
         * Load EmulatorJS using the
         * documented loader pattern.
         */

        const emulatorLoader =
            document.createElement("script");


        emulatorLoader.src =
            window.EJS_pathtodata +
            "loader.js";


        document.head.appendChild(
            emulatorLoader
        );

    </script>

</head>


<body>

<header>

    <div class="logo">
        INCRWD
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="games.html">
            Games
        </a>

        <a href="gameboys.html">
            Gameboys
        </a>

        <a href="add-game.html">
            Add Game
        </a>

    </nav>

</header>


<main>

    <h1>
        🕹️ Emulator
    </h1>


    <p
        id="subtitle"
        class="subtitle">
        Loading emulator...
    </p>


    <div class="controls">

        <select id="system">

            <option value="gb">
                Game Boy
            </option>

            <option value="gbc">
                Game Boy Color
            </option>

            <option value="gba"
                    selected>
                Game Boy Advance
            </option>

        </select>


        <input
            id="localRom"
            type="file"
            accept=".gb,.gbc,.gba"
        />


        <button
            id="localButton"
            class="primary">

            Load Local ROM

        </button>

    </div>


    <div class="emulator-shell">

        <div id="game"></div>

    </div>


    <div
        id="status"
        class="status">

        Initializing...

    </div>

</main>


<footer>

    EmulatorJS retains its applicable license.

</footer>


<script>

const subtitle =
    document.getElementById(
        "subtitle"
    );


const status =
    document.getElementById(
        "status"
    );


const system =
    document.getElementById(
        "system"
    );


const localRom =
    document.getElementById(
        "localRom"
    );


const localButton =
    document.getElementById(
        "localButton"
    );


const romParameter =
    new URLSearchParams(
        window.location.search
    ).get("rom");


const coreParameter =
    new URLSearchParams(
        window.location.search
    ).get("core");


if (romParameter) {

    subtitle.textContent =
        "Loading " +
        romParameter.split("/").pop();

    status.textContent =
        "Starting " +
        (
            coreParameter ||
            "gba"
        ) +
        " emulator...";

} else {

    subtitle.textContent =
        "Choose a ROM to play.";

    status.textContent =
        "No ROM supplied.";

}


function loadLocalROM() {

    const file =
        localRom.files[0];


    if (!file) {

        status.textContent =
            "Choose a .gb, .gbc, or .gba file.";

        return;

    }


    const selectedSystem =
        system.value;


    if (
        selectedSystem === "gb" &&
        !file.name.toLowerCase().endsWith(".gb")
    ) {

        status.textContent =
            "This system expects a .gb file.";

        return;

    }


    if (
        selectedSystem === "gbc" &&
        !file.name.toLowerCase().endsWith(".gbc")
    ) {

        status.textContent =
            "This system expects a .gbc file.";

        return;

    }


    if (
        selectedSystem === "gba" &&
        !file.name.toLowerCase().endsWith(".gba")
    ) {

        status.textContent =
            "This system expects a .gba file.";

        return;

    }


    const url =
        URL.createObjectURL(file);


    window.EJS_gameUrl =
        url;


    window.EJS_gameName =
        file.name;


    window.EJS_core =
        selectedSystem;


    status.textContent =
        "Local ROM selected: " +
        file.name +
        ". Reloading emulator...";


    window.location.href =
        "emulator.html?rom=" +
        encodeURIComponent(
            url
        ) +
        "&core=" +
        encodeURIComponent(
            selectedSystem
        );

}


localButton.addEventListener(
    "click",
    loadLocalROM
);

</script>

</body>
</html>
